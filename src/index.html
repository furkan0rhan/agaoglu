<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Tarım Market Pro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf0e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a2d25" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Tarım Market Pro - stok, satış ve veresiye takibi">
  <link rel="icon" type="image/png" sizes="128x128" href="assets/favicon-128.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body>
  <!-- #31: Angular yüklenene kadar boş ekran yerine açılış ekranı (App bileşeni oturum/rota hazır olana dek sürdürür) -->
  <style>
    .tm-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f4ec; color: #4b5242;
      font: 600 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; z-index: 2147483000; }
    .tm-boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .tm-boot-mark { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #10291a;
      background: linear-gradient(135deg, #b9dbbc, #7fb487); box-shadow: 0 8px 24px rgba(40, 80, 50, .18); }
    .tm-boot-bar { width: 120px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(0, 0, 0, .08); }
    .tm-boot-bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #5f9a67;
      animation: tm-boot 1.1s ease-in-out infinite; }
    @keyframes tm-boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      .tm-boot { background: #22231e; color: #c9cdbf; }
      .tm-boot-bar { background: rgba(255, 255, 255, .1); }
    }
    @media (prefers-reduced-motion: reduce) { .tm-boot-bar::after { animation: none; width: 100%; } }
  </style>
  <app-root>
    <div class="tm-boot" role="status" aria-live="polite">
      <div class="tm-boot-in">
        <div class="tm-boot-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21v-8" /><path d="M12 13C12 8 9 5 4 5c0 5 3 8 8 8z" /><path d="M12 15c0-4 3-7 8-7 0 5-3 7-8 7z" />
          </svg>
        </div>
        <div>Tarım Market Pro</div>
        <div class="tm-boot-bar" aria-hidden="true"></div>
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Yükleniyor…</span>
      </div>
    </div>
  </app-root>
</body>
</html>
