name: Android APK Build

# Nasıl kullanılır (ayrıntı: docs/APK.md):
#   npm run release -- 1.2.0  -> tag v1.2.0 push edilir; bu workflow Android'i derler.
#   Secret'lar (ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD) varsa:
#     imzalı release APK (arm64 + armv7, tek "universal" dosya) + Play Store için AAB.
#   Secret'lar yoksa: eskisi gibi imzasız DEBUG APK üretir (iş kırılmaz, özet sayfasında uyarı çıkar).
#   Tag'li çalışmada APK (ve AAB) Windows workflow'unun kullandığı AYNI GitHub Release taslağına eklenir.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      mode: ${{ steps.signing.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version (tauri.conf.json)
        id: meta
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $VERSION"

      - name: Setup Android signing
        id: signing
        working-directory: src-tauri/gen/android
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
            {
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "password=$ANDROID_KEY_PASSWORD"
              echo "storeFile=$RUNNER_TEMP/keystore.jks"
            } > keystore.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "İmza secret'ları bulundu: imzalı release derlenecek."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning title=Android imzasız::ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secret'ları eksik. İmzasız DEBUG APK üretiliyor (docs/APK.md)."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # versionName/versionCode: Tauri CLI her derlemede tauri.conf.json "version"undan
      # app/tauri.properties üretir (versionCode = major*1000000 + minor*1000 + patch).
      - name: Build signed release (APK + AAB)
        if: steps.signing.outputs.mode == 'release'
        run: npx tauri android build --apk --aab --target aarch64 --target armv7

      - name: Build debug APK (fallback, imzasız)
        if: steps.signing.outputs.mode != 'release'
        run: npx tauri android build --debug --apk --target aarch64 --target armv7

      - name: Collect outputs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          OUT=src-tauri/gen/android/app/build/outputs
          mkdir -p dist-android
          if [ "$MODE" = "release" ]; then
            APK=$(find "$OUT/apk" -path '*release*' -name '*.apk' ! -name '*unsigned*' | head -n 1)
            AAB=$(find "$OUT/bundle" -path '*elease*' -name '*.aab' | head -n 1)
            [ -n "$APK" ] || { echo "::error::İmzalı APK bulunamadı"; find "$OUT" -type f; exit 1; }
            [ -n "$AAB" ] || { echo "::error::AAB bulunamadı"; find "$OUT" -type f; exit 1; }
            cp "$APK" "dist-android/TarimMarketPro-$VERSION.apk"
            cp "$AAB" "dist-android/TarimMarketPro-$VERSION.aab"
            echo "İmza kontrolü:"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist-android/TarimMarketPro-$VERSION.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          else
            APK=$(find "$OUT/apk" -path '*debug*' -name '*.apk' | head -n 1)
            [ -n "$APK" ] || { echo "::error::Debug APK bulunamadı"; find "$OUT" -type f; exit 1; }
            cp "$APK" "dist-android/TarimMarketPro-$VERSION-debug.apk"
          fi
          {
            echo "### Android çıktıları (v$VERSION)"
            if [ "$MODE" = "release" ]; then
              echo "İmzalı **release** — arm64-v8a + armeabi-v7a (tek universal APK)."
            else
              echo "> :warning: **İmza secret'ları eksik — imzasız DEBUG APK üretildi.** Kurulum için çalışır ama güncellemeler imzalı sürümle uyumsuz olur. Secret ekleme: docs/APK.md"
            fi
            echo ""
            echo "| Dosya | Boyut |"
            echo "|---|---|"
            for f in dist-android/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la dist-android

      - name: Remove signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/keystore.jks"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarimMarketPro-${{ steps.meta.outputs.version }}-android-${{ steps.signing.outputs.mode }}
          path: dist-android/*
          retention-days: 30

  # Aynı tag için Windows workflow'u da release'e yazar. Yarışmamak için iki workflow
  # "gh-release-<tag>" concurrency grubunu paylaşır: release yoksa oluşturulur, varsa dosya eklenir.
  publish-release:
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: gh-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download Android outputs
        uses: actions/download-artifact@v4
        with:
          name: TarimMarketPro-${{ needs.build-android.outputs.version }}-android-${{ needs.build-android.outputs.mode }}
          path: dist-android

      - name: Ensure draft release exists and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$TAG\")][0].id // empty")
          if [ -z "$ID" ]; then
            BODY=$(printf '%s\n\n%s\n%s\n%s\n' \
              "Tarım Market Pro $TAG" \
              "- **Windows:** \`*_x64-setup.exe\` (önerilen) veya \`.msi\`" \
              "- **Android:** \`TarimMarketPro-*.apk\` — telefona kurulum: docs/APK.md" \
              "- \`.aab\` yalnız Google Play Console'a yüklemek içindir (telefona kurulmaz).")
            ID=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="Tarım Market Pro $TAG" -f body="$BODY" \
              -F draft=true -F prerelease=false --jq .id)
            echo "Taslak release oluşturuldu (id=$ID)."
          else
            echo "Mevcut release bulundu (id=$ID), dosyalar eklenecek."
          fi
          gh release upload "$TAG" dist-android/* --clobber --repo "$REPO"
