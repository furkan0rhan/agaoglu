name: Windows Release (EXE + MSI)

# Nasıl kullanılır:
#   npm run release -- 1.0.1     -> sürümü günceller, commit + tag (v1.0.1) atar, push eder
#   GitHub Actions bu tag'i görünce Windows'ta derler ve
#   Releases sayfasına TASLAK bir sürüm olarak .exe (NSIS kurulum) ve .msi yükler.
#   Android workflow'u (android-build.yml) aynı taslağa .apk/.aab ekler.
#   Taslağı kontrol edip "Publish" demen yeterli.
#
# Otomatik güncelleme: uygulamalar .../releases/latest/download/latest.json'a bakar. TASLAK ve
# pre-release "latest" sayılmaz; yani güncelleme bayilere ancak "Publish" basılınca ulaşır.
# Gerekli secret'lar: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (README > EXE).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Android workflow'u ile aynı "gh-release-<tag>" concurrency grubunu paylaşır:
  # iki workflow aynı anda iki ayrı taslak oluşturamaz. Release yoksa oluşturur, varsa id'sini döner.
  ensure-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: gh-release-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - name: Ensure draft release exists
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ID=$(gh api "repos/$REPO/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$TAG\")][0].id // empty")
          if [ -z "$ID" ]; then
            BODY=$(printf '%s\n\n%s\n%s\n%s\n' \
              "Tarım Market Pro $TAG" \
              "- **Windows:** \`*_x64-setup.exe\` (önerilen) veya \`.msi\`" \
              "- **Android:** \`TarimMarketPro-*.apk\` — telefona kurulum: docs/APK.md" \
              "- \`.aab\` yalnız Google Play Console'a yüklemek içindir (telefona kurulmaz).")
            ID=$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="Tarım Market Pro $TAG" -f body="$BODY" \
              -F draft=true -F prerelease=false --jq .id)
            echo "Taslak release oluşturuldu (id=$ID)."
          else
            echo "Mevcut release bulundu (id=$ID)."
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: ensure-release
    # ensure-release elle çalıştırmada (workflow_dispatch) atlanır; derleme yine çalışsın.
    if: ${{ !cancelled() && !failure() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # Otomatik güncelleme imzası: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD) secret'ları varsa
      # tauri-action .sig dosyalarını ve latest.json'u release'e yükler. Secret yoksa derleme yine
      # başarılı olur ama güncelleme dosyaları üretilmez (createUpdaterArtifacts=false ile ezilir;
      # aksi halde tauri "public key has been found, but no private key" hatasıyla durur).
      - name: Check updater signing key
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "Güncelleme imza anahtarı bulundu: latest.json + .sig üretilecek."
          else
            # JSON'u dosyaya yaz: tırnaklı satır içi JSON npm/cmd üzerinden bozulabiliyor.
            F="$RUNNER_TEMP/tauri-no-updater.conf.json"
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$F"
            echo "args=--config $(cygpath -w "$F")" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret'ı yok: bu sürüm otomatik güncelleme ile DAĞITILMAZ (latest.json üretilmedi)."
          fi

      - name: Build and upload to draft release
        if: needs.ensure-release.outputs.release_id != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.ensure-release.outputs.release_id }}
          args: ${{ steps.signing.outputs.args }}
          # latest.json'daki genel "windows-x86_64" girdisi setup.exe'yi (NSIS) göstersin (önerilen kurulum).
          updaterJsonPreferNsis: true

      - name: Build only (no tag)
        if: needs.ensure-release.outputs.release_id == ''
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ steps.signing.outputs.args }}

      - name: Upload artifact (no tag)
        if: needs.ensure-release.outputs.release_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: TarimMarketPro-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
