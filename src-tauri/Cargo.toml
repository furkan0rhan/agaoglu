[package]
name = "tarim-market"
version = "1.3.3"
description = "Tarım Market Pro - Stok ve Satış Yönetimi"
authors = ["Furkan Orhan"]
edition = "2021"

[lib]
name = "tarim_market_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tarim-market"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Kamera ile barkod/QR/DataMatrix okuma — yalnız mobil (Android/iOS).
# ~2.4.6: tauri ^2.10 ister (2.5.x tauri 2.12 ister; @tauri-apps/api 2.11 ile uyumsuz olurdu).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "~2.4.6"

# Otomatik güncelleme (GitHub Releases > latest.json) + güncelleme sonrası yeniden başlatma — yalnız masaüstü.
# ~2.12 / ~2.3.1: tauri ^2.10 / ^2.8 ister (2.13+/2.4 tauri 2.12 ister; @tauri-apps/api 2.11 ile uyumsuz olurdu).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "~2.12.0"
tauri-plugin-process = "~2.3.1"

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
